<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The First Contest · against the computer</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=IM+Fell+English:ital@0;1&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/play.css?v=2026-11-02i">
  <!-- ?v= makes a browser fetch fresh files after each update; bump it with every change -->
  <script type="importmap">{"imports": {"./js/play.js": "./js/play.js?v=2026-11-02i", "./js/cards.js": "./js/cards.js?v=2026-11-02i", "./js/game/rules.js": "./js/game/rules.js?v=2026-11-02i", "./js/game/ai.js": "./js/game/ai.js?v=2026-11-02i"}}</script>
  <script type="module" src="js/play.js?v=2026-11-02i"></script>
</head>
<body>
  <header id="top">
    <div class="brand">The First Contest <span>against the computer</span></div>
    <div id="status" aria-live="polite"></div>
    <div class="top-actions">
      <button id="btnVoids" type="button">Voids</button>
      <button id="btnRules" type="button">How to play</button>
      <button id="btnNew" type="button">New contest</button>
      <a class="btnlink" href="index.html">Two-player table</a>
    </div>
  </header>
  <main id="main">
    <section id="left">
      <div id="board" aria-label="Table">
        <div id="oppBar" class="pbar"></div>
        <div id="oppWorlds" class="worlds" aria-label="The computer's worlds"></div>
        <div id="inplay" aria-label="Forces in play"></div>
        <div id="myWorlds" class="worlds" aria-label="Your worlds"></div>
        <div id="myBar" class="pbar"></div>
      </div>
      <div id="prompt"></div>
      <details id="logbox" open>
        <summary>What happened</summary>
        <ol id="log"></ol>
      </details>
    </section>
    <section id="right" aria-label="Your binder">
      <div id="binder"></div>
    </section>
  </main>
  <div id="peek" hidden aria-hidden="true"></div>
  <div id="overlay" hidden></div>
</body>
</html>
